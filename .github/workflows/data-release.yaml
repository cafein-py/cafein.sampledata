name: data-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Data release tag, e.g. helsinki-2026.08 or helsinki-2026.08.1"
        required: true
      snapshot_date:
        description: "Geofabrik snapshot date, YYMMDD (immutable source)"
        required: true
      reference_date:
        description: "Service date for validation/smoke, YYYY-MM-DD"
        required: true
      airquality_hour:
        description: "ENFUSER valid hour, ISO instant e.g. 2026-08-18T06:00:00Z"
        required: true

permissions:
  contents: write

# Inputs reach the shell only as quoted env vars, never interpolated
# into command text.
env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
  REFERENCE_DATE: ${{ inputs.reference_date }}
  AIRQUALITY_HOUR: ${{ inputs.airquality_hour }}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate the inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^helsinki-[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]] \
            || { echo "malformed release_tag"; exit 1; }
          [[ "$SNAPSHOT_DATE" =~ ^[0-9]{6}$ ]] \
            || { echo "malformed snapshot_date"; exit 1; }
          [[ "$REFERENCE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "malformed reference_date"; exit 1; }
          [[ "$AIRQUALITY_HOUR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$ ]] \
            || { echo "malformed airquality_hour"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: pipeline/environment.yaml
          cache-environment: true
      - name: Refresh cafein
        # The cached environment can hold an old cafein; the factor
        # byte-equality check must run against the newest release.
        shell: bash -el {0}
        run: python -m pip install -U cafein
      # The newest steps run first: they are the most likely to hit
      # live-service drift, and failing before the heavy established
      # downloads keeps the feedback loop short.
      - name: Air-quality step
        shell: bash -el {0}
        run: python -m pipeline.air_quality work "$AIRQUALITY_HOUR"
      - name: Green view step
        shell: bash -el {0}
        run: python -m pipeline.green_view work
      - name: Noise step
        shell: bash -el {0}
        run: python -m pipeline.noise work
      - name: OSM step
        # out_of_core decodes in parallel (workers=auto: one per core);
        # in_memory would read the country extract on a single core.
        shell: bash -el {0}
        run: >-
          python -m pipeline.osm work --snapshot-date "$SNAPSHOT_DATE"
          --engine out_of_core
      - name: POI step
        # Reads the extract the OSM step just published, so the points
        # and the street network cover one and the same area.
        shell: bash -el {0}
        run: python -m pipeline.pois work
      - name: GTFS step
        shell: bash -el {0}
        run: python -m pipeline.gtfs work --reference-date "$REFERENCE_DATE"
      - name: DEM step
        shell: bash -el {0}
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
        run: python -m pipeline.dem work
      - name: Population step
        shell: bash -el {0}
        run: python -m pipeline.population work
      - name: Paavo step
        shell: bash -el {0}
        run: python -m pipeline.paavo work
      - name: Smoke build (cafein consumes every asset)
        shell: bash -el {0}
        run: python -m pipeline.smoke work "$REFERENCE_DATE"
      - name: Assemble the release artifacts
        shell: bash -el {0}
        run: python -m pipeline.release work "$RELEASE_TAG"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target pins the new tag to this run's commit rather than
        # the default branch's current tip.
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file work/RELEASE_NOTES.md \
            work/helsinki_capital_region.osm.pbf \
            work/hsl_gtfs.zip \
            work/helsinki_dem_10m.tif \
            work/hsy_population_grid_250m.gpkg \
            work/helsinki_pois_library.gpkg \
            work/helsinki_pois_kindergarten.gpkg \
            work/helsinki_pois_university.gpkg \
            work/helsinki_pois_supermarket.gpkg \
            work/helsinki_pois_shopping_centre.gpkg \
            work/helsinki_pois_sports_centre.gpkg \
            work/helsinki_pois_swimming_hall.gpkg \
            work/helsinki_air_quality.tif \
            work/helsinki_green_view.gpkg \
            work/helsinki_noise_2022.gpkg \
            work/statfi_paavo_income.gpkg \
            work/manifest.json \
            work/gtfs-validation-report.json \
            work/LICENSES.txt
      - name: Preserve the validation report of a rejected feed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-validation-report-failed
          path: work/gtfs-validation-report.failed.json
          if-no-files-found: ignore
